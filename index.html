<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROUD TOWN — Evolution of Roleplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #1e90ff;
            --gold-bright: #60b4ff;
            --blue-fb: #1877f2;
            --dark: #0a0a0a;
            --darker: #050505;
            --surface: #111111;
            --text: #d4d4d4;
            --muted: #555;
        }

        /* [SYSTEM] ป้องกันการลากคลุมและการลากรูปภาพ */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-user-drag: none;
            user-drag: none;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Effects */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0; opacity: 0.6;
        }

        .bg-grid {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(30,144,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(30,144,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridDrift 20s linear infinite;
            z-index: 0;
        }
        @keyframes gridDrift { 0% { transform: translateY(0); } 100% { transform: translateY(60px); } }

        .spotlight {
            position: fixed; top: -20%; left: 50%; transform: translateX(-50%);
            width: 600px; height: 600px;
            background: radial-gradient(ellipse at center, rgba(30,144,255,0.06) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        .container { position: relative; z-index: 10; text-align: center; padding: 2rem; max-width: 680px; width: 100%; }

        /* Logo & Title */
        .logo-emblem {
            width: 90px; height: 90px;
            background: linear-gradient(135deg, #1a1a1a, #222);
            border: 1px solid rgba(30,144,255,0.4);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Bebas Neue', cursive; font-size: 3rem; color: var(--gold);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            animation: emblemFloat 6s ease-in-out infinite; margin: 0 auto 1.5rem;
        }
        @keyframes emblemFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(4rem, 15vw, 7rem);
            letter-spacing: 0.04em; color: #fff; line-height: 0.9; margin-bottom: 0.5rem;
        }
        h1 .highlight { color: var(--gold); }

        .tagline { font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--muted); margin-bottom: 3rem; }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            margin-bottom: 3rem;
        }

        .social-wrapper {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        @media (min-width: 600px) {
            .btn-group { flex-direction: row; justify-content: center; }
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 32px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.15em;
            text-transform: uppercase; text-decoration: none; color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        }

        .btn-primary { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(30,144,255,0.3); }
        .btn-primary:hover { background: var(--gold-bright); transform: translateY(-2px); }

        .btn-secondary { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.15); }
        .btn-secondary:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

        /* Social Icons Buttons */
        .btn-discord, .btn-facebook { width: 52px; height: 52px; padding: 0; }

        .btn-discord { background: rgba(88, 101, 242, 0.15); border: 1px solid rgba(88, 101, 242, 0.4); color: #7289da; }
        .btn-discord:hover { background: rgba(88, 101, 242, 0.25); border-color: #5865F2; color: #fff; transform: translateY(-2px); }

        .btn-facebook { background: rgba(24, 119, 242, 0.15); border: 1px solid rgba(24, 119, 242, 0.4); color: var(--blue-fb); }
        .btn-facebook:hover { background: rgba(24, 119, 242, 0.25); border-color: var(--blue-fb); color: #fff; transform: translateY(-2px); }

        /* Decorations */
        .corner { position: fixed; width: 60px; height: 60px; border-color: rgba(30,144,255,0.2); border-style: solid; pointer-events: none; }
        .corner-tl { top: 20px; left: 20px; border-width: 1px 0 0 1px; }
        .corner-tr { top: 20px; right: 20px; border-width: 1px 1px 0 0; }
        .corner-bl { bottom: 20px; left: 20px; border-width: 0 0 1px 1px; }
        .corner-br { bottom: 20px; right: 20px; border-width: 0 1px 1px 0; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="spotlight"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="container">
        <div class="logo-emblem">P T</div>

        <h1>PROUD <span class="highlight">TOWN</span></h1>
        <p class="tagline">Enjoy to play</p>

        <div class="btn-group">

                Download
            </a>
            <a href="rules_general.html" class="btn btn-secondary">

            <div class="social-wrapper">
                <a href="https://discord.gg/jWbcXby7m" target="_blank" class="btn btn-discord">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.069.069 0 0 0-.032.027C.533 9.048-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.419-2.157 2.419z"/></svg>

                <a href="https://www.facebook.com/share/1aiFMYQrN1/" target="_blank" class="btn btn-facebook">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 1. ห้ามคลิกขวา
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. ห้ามปุ่มลัด Inspect Element / Source Code / Save Page
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; // F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U (Source)
            if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) return false; // Ctrl+S (Save)
            if(e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false; // Ctrl+P (Print)
        };

        // 3. ห้าม Copy (ในกรณีที่หลุดการป้องกัน CSS)
        document.addEventListener('copy', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
